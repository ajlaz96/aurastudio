<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4b6d2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aura studio :･ﾟ✧*:･ﾟ✧</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="controls">

<label class="color-control">
  <span>Background</span>
  <input type="color" id="backgroundPicker" value="#f4b6d2" />
  <span class="color-dot" id="backgroundDot"></span>
</label>

<label class="color-control">
  <span>Aura</span>
  <input type="color" id="colorPicker" value="#ff7a5c" />
  <span class="color-dot" id="auraDot"></span>
</label>

    <button id="addAuraButton">+ Add Aura</button>
    <button id="undoButton">Undo</button>
    <button id="redoButton">Redo</button>
    <button id="clearButton">Clear</button>
    <button id="textureButton">Texture</button>
    <button id="downloadButton">Download</button>
  </div>

  <div id="sizePopover" class="size-popover hidden">
  <span>Size</span>
  <input type="range" id="sizeSlider" min="60" max="420" value="180">
</div>
<button
  type="button"
  id="hideToolsButton"
  class="hide-tools-button">
  Hide tools
</button>

<button
  type="button"
  id="showToolsButton"
  class="show-tools-button">
  Show tools
</button>

<!-- Custom mobile colour picker -->
<div id="mobileColorPicker" class="mobile-color-picker hidden">

  <div class="mobile-color-picker-header">
    <span id="mobileColorPickerTitle">Choose colour</span>
    <button type="button" id="mobileColorPickerDone">Done</button>
  </div>

  <div id="colorField" class="color-field">
    <div id="colorFieldCursor" class="color-field-cursor"></div>
  </div>

  <input
    type="range"
    id="hueSlider"
    class="hue-slider"
    min="0"
    max="360"
    value="0"
  >

</div>

<div class="instructions" id="instructions">
  <button class="instructions-close" id="instructionsClose">×</button>

  <div class="desktop-instructions">
    <p>Click anywhere to place aura</p>
    <p>Click and drag aura to reshape</p>
    <p>Click aura edge to soften</p>
  </div>

  <div class="mobile-instructions">
    <p>Tap anywhere to place aura</p>
    <p>Tap and drag aura to reshape</p>
    <p>Tap aura edge to soften</p>
  </div>

  <a
    class="aura-instagram-link"
    href="https://www.instagram.com/aura_a_day/"
    target="_blank"
    rel="noopener noreferrer">
    @aura_a_day
  </a>
</div>

  <div id="canvas">
    <svg id="auraSvg"></svg>
    <div id="textureLayer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
